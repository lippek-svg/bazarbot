name: BazarBOT Hourly Check

on:
  schedule:
    - cron: '0 * * * *' # Spustí sa automaticky každú hodinu
  workflow_dispatch: # Umožňuje spustiť bot aj manuálne

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 firebase-admin streamlit

      - name: Run bot script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python checker.py
